<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
* {
  margin: 0;
  padding: 0;
  border-radius: 15px; 
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  -webkit-app-region: drag;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.1); }
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.drag-handle {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 80px;
  background: linear-gradient(135deg, rgba(120, 40, 200, 0.95) 0%, rgba(147, 51, 234, 0.92) 50%, rgba(168, 85, 247, 0.90) 100%);
  border-radius: 15px;
  pointer-events: none;
  animation: fadeIn 0.8s ease-out 0.3s both;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

#time {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  pointer-events: none;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
  font-variant-numeric: tabular-nums;
  margin-bottom: 2px;
  margin-top: 8px;
  background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.85) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

button {
  margin-top: 8px;
  background: rgba(255, 77, 109, 0.9);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 24px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
  -webkit-app-region: no-drag;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 4px 16px rgba(255, 77, 109, 0.3);
}

button:hover {
  background: rgba(255, 77, 109, 1);
  border-color: rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255, 77, 109, 0.5);
}

button:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(255, 77, 109, 0.4);
}
</style>

</head>
<body>
  <div class="drag-handle"></div>
  
  <div class="container">
    <div id="time">--:--</div>
    <button onclick="overlay.cancel()">Cancelar</button>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
