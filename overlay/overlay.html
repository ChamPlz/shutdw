<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShutDW - Overlay</title>
  <link rel="stylesheet" href="overlay.css" />
</head>

<body>
  <div class="overlay">
    <button class="close" onclick="overlay.close()" title="Fechar">×</button>

    <div class="pill">
      <div class="pill-inner">
        <div id="time">--:--</div>
        <button class="cancel" onclick="overlay.cancel()">cancelar</button>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>

</html>
