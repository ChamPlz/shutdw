name: Build/Release Electron App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - os: windows-latest
            platform: windows
            arch: x64
          - os: windows-latest
            platform: windows
            arch: ia32

          # ── Linux ──
          - os: ubuntu-latest
            platform: linux
            arch: x64

          # ── macOS ──
          - os: macos-latest
            platform: mac
            arch: universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm >= 11.10 (suporta min-release-age/allow-git)
        run: npm install -g npm@11.10.0

      - name: Install dependencies
        run: npm ci

      - name: Verify installation
        run: |
          npm list --depth=0
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      # ── Build per platform ──
      - name: Build and Publish (Windows)
        if: matrix.platform == 'windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --windows --${{ matrix.arch }} --publish always

      - name: Build and Publish (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --${{ matrix.arch }} --publish always

      - name: Build and Publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY: '-'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish always

      # ── Upload artifacts ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          retention-days: 30